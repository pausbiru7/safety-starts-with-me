<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pausbiru Safety - Portal Utama</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .container { max-width: 450px; width: 100%; background: #ffffff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
    
    /* HEADER PORTAL */
    .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 40px 20px; text-align: center; position: relative; }
    .header h1 { font-size: 2rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header p { font-size: 0.95rem; color: #94a3b8; font-weight: 500; }
    .badge-version { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #cbd5e1; }

    /* MENU SECTION */
    .menu-section { padding: 30px 20px; }
    
    .menu-card { display: flex; align-items: center; background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 15px; text-decoration: none; color: #333; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .menu-card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.1); }
    .menu-card:active { transform: translateY(0); }
    
    /* CARD 1: CHECKLIST */
    .card-chk { border-left: 6px solid #2563eb; }
    .icon-chk { font-size: 2.5rem; margin-right: 15px; background: #dbeafe; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
    
    /* CARD 2: HAZARD */
    .card-hzd { border-left: 6px solid #ea580c; }
    .icon-hzd { font-size: 2.5rem; margin-right: 15px; background: #ffedd5; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 14px; }

    .menu-text h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; color: #0f172a; }
    .menu-text p { font-size: 0.85rem; color: #64748b; line-height: 1.4; }

    /* FOOTER */
    .footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #94a3b8; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    .footer strong { color: #64748b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="badge-version">v5.0</div>
    <h1>⛑️ PAUSBIRU SAFETY</h1>
    <p>Your Daily Safety Command Center</p>
  </div>
  
  <div class="menu-section">
    <!-- MENU 1: CHECKLIST -->
    <a href="checklist.html" class="menu-card card-chk">
      <div class="icon-chk">📋</div>
      <div class="menu-text">
        <h2>Daily Pre-Start Checklist</h2>
        <p>Isi formulir inspeksi harian sebelum memulai pekerjaan.</p>
      </div>
    </a>

    <!-- MENU 2: HAZARD & BBS -->
    <a href="hazard.html" class="menu-card card-hzd">
      <div class="icon-hzd">⚠️</div>
      <div class="menu-text">
        <h2>Hazard & BBS Report</h2>
        <p>Laporkan kondisi bahaya atau tindakan positif di lapangan.</p>
      </div>
    </a>
  </div>

  <div class="footer">
    Safety Starts With Me © 2026<br>
    <small>Powered by <strong>Pausbiru7</strong></small>
  </div>
</div>

</body>
</html>
