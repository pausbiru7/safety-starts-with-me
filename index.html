<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAUSBIRU SAFETY</title>
<meta name="theme-color" content="#1a5276">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f4f8;min-height:100vh;padding:12px;line-height:1.5}
.container{max-width:600px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden}
.header {background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%);color: #fff;padding: 32px 24px;position: relative;overflow: hidden;display: flex;flex-direction: column;align-items: center;text-align: center;}
.header::before {content: '';position: absolute;top: 0;left: 0;right: 0;height: 4px;background: linear-gradient(90deg, #f59e0b, #10b981, #ef4444, #8b5cf6);}
.header h1 {font-size: 1.5rem;font-weight: 900;letter-spacing: .5px;text-shadow: 0 2px 4px rgba(0, 0, 0, .3);}
.header p {font-size: .85rem;opacity: .9;margin-top: 6px;}
.badge {display: inline-flex;align-items: center;justify-content: center;background: #f59e0b;color: #fff;font-size: .7rem;padding: 6px 14px;border-radius: 20px;margin-top: 12px;font-weight: 700;animation: pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.section{padding:24px;border-bottom:1px solid #f1f5f9}
.section:last-child{border-bottom:none}
.section-title{font-size:1.1rem;font-weight:800;color:#1a5276;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.icon-blue{background:#dbeafe;color:#2563eb}.icon-red{background:#fee2e2;color:#dc2626}.icon-green{background:#d1fae5;color:#059669}.icon-orange{background:#ffedd5;color:#ea580c}.icon-purple{background:#ede9fe;color:#7c3aed}
label{display:block;font-size:.88rem;color:#374151;margin-bottom:6px;font-weight:600}
input,textarea,select{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:.92rem;margin-bottom:16px;transition:all .2s;font-family:inherit;background:#fff;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#2e86c1;box-shadow:0 0 0 4px rgba(46,134,193,.15)}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:12px}.row>div{flex:1}
.check-group{margin-bottom:16px}
.check-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #f3f4f6;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.check-item::before{content:'';position:absolute;left:0;top:0;height:100%;width:4px;transform:scaleY(0);transition:transform .2s}
.check-item:hover{border-color:#2e86c1;background:#f0f7ff;transform:translateX(2px)}
.check-item.sel-g::before{transform:scaleY(1);background:#059669}
.check-item.sel-b::before{transform:scaleY(1);background:#dc2626}
.check-item input[type="radio"],.check-item input[type="checkbox"]{accent-color:#2e86c1;width:18px;height:18px;margin:0;flex-shrink:0}
.check-item label{margin:0;cursor:pointer;font-weight:600;color:#1f2937;flex:1}
.hazard-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:12px;}
.hazard-card .hazard-title{font-weight:800;color:#1a5276;margin-bottom:10px;font-size:1rem}
.hazard-check{display:flex;align-items:flex-start;gap:10px;padding:10px;font-size:.88rem;color:#374151;cursor:pointer;border-radius:8px;transition:all .2s}
.hazard-check:hover{background:#f1f5f9}
.hazard-check input[type="checkbox"]{accent-color:#e74c3c;width:18px;height:18px;margin-top:2px;flex-shrink:0}
.control-box{background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:14px;margin:6px 0 12px 40px;animation:slideIn .3s ease-out}
.control-box label{color:#92400e;font-size:.85rem;font-weight:800;margin-bottom:6px}
.control-box textarea{font-size:.85rem;border-color:#f59e0b;margin-bottom:0}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.custom-hazard-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.custom-hazard-row input[type="text"]{margin-bottom:0;flex:1}
.add-btn{background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;}
.remove-btn{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer;font-weight:600}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#1a5276,#2e86c1);color:#fff}
.btn-wa{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn-approve{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-reject{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-back{background:#f3f4f6;color:#6b7280;border:2px solid #e5e7eb}
.step{display:none}.step.active{display:block;animation:fadeInUp .4s ease-out}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.dots{display:flex;justify-content:center;gap:8px;padding:20px;background:#f8fafc}
.dot{width:12px;height:12px;border-radius:50%;background:#d1d5db;transition:all .3s ease}
.dot.active{background:#2e86c1;width:32px;border-radius:16px;}
.sbox{background:#f8fafc;border-radius:14px;padding:20px;font-size:.86rem;line-height:1.8;border-left:4px solid #2e86c1;margin:16px 0}
.sbox hr{border:none;border-top:1px dashed #d1d5db;margin:12px 0}
.sv-banner{text-align:center;padding:28px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;margin:-24px -24px 20px;border-radius:0 0 16px 16px}
.sv-banner h2{margin:12px 0 8px;font-size:1.4rem;font-weight:900}
.result-card{text-align:center;padding:40px 24px}
.result-card .big{font-size:5rem;margin-bottom:16px;line-height:1}
.sent-info{background:#dbeafe;border-radius:12px;padding:16px;margin-top:16px;font-size:.85rem;color:#1e40af;border-left:4px solid #2563eb}
.sent-info.approved{background:#d1fae5;color:#065f46;border-left-color:#059669}
.sent-info.rejected{background:#fee2e2;color:#991b1b;border-left-color:#dc2626}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;align-items:center;justify-content:center}
.overlay.show{display:flex}
.progress-box{background:#fff;border-radius:20px;padding:32px 28px;text-align:center;max-width:320px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.progress-box .spinner{width:48px;height:48px;border:4px solid #e5e7eb;border-top-color:#2e86c1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{padding:20px;text-align:center;font-size:.78rem;color:#9ca3af;border-top:1px solid #f1f5f9}

/* KELAS BARU UNTUK TANDA TANGAN & KAMERA */
.sig-container { border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; overflow: hidden; position: relative; margin-bottom: 8px; }
.sig-pad { width: 100%; height: 180px; touch-action: none; display: block; }
.clear-sig { background: #f1f5f9; color: #dc2626; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 12px; font-size: .8rem; font-weight: bold; cursor: pointer; }
.photo-box { border: 2px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; padding: 20px; text-align: center; margin-bottom: 15px; }
#fotoPreview { display: none; width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 2px solid #e2e8f0; }
.gps-box { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 10px; font-size: 0.85rem; margin-top: 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="container" id="app">

  <div class="header">
    <h1>⛑️ PAUSBIRU SAFETY</h1>
    <p>Daily Pre-Work Safety Checklist v3.2</p>

  </div>

    <div class="section step" id="step6"></div>

  <div id="SM" style="display:none"></div>
  <div id="SD" style="display:none"></div>

  <div class="footer">
    Safety Starts With Me © 2026 | v3.2<br>

<script>
/* ============================================================
   KONFIGURASI
   ============================================================ */
const CONFIG = {
  BASE_URL : "https://pausbiru7.github.io/safety-starts-with-me/",
  GAS_URL  : "PASTE_WEB_APP_URL_YANG_BARU_DISINI", // <--- GANTI INI NANTI
  HSE_WA   : "6282141150007"
};

const SUPERVISORS = [
  { name:"Muharza",      title:"Project Manager",       wa:"628116923792",  dept:"Project"   },
  { name:"Muji Agus",    title:"Electrical Supervisor", wa:"6281254346552", dept:"Electrical"},
  { name:"Safarudin",    title:"Mechanical Supervisor", wa:"6281315693779", dept:"Mechanical"},
  { name:"Muh Yusuf",    title:"Project Controller",    wa:"6285399450821", dept:"Project"   },
  { name:"Adiyo A ",     title:"QA/QC Officer",         wa:"6282257449322", dept:"Quality"   }
];

const HZDATA = [
  { id: 'mek', n: '⚙️ Bahaya Mekanik', items: ['Terjepit mesin', 'Terpotong benda tajam', 'Tertimpa material', 'Terbentur benda keras'] },
  { id: 'kat', n: '🧗 Bahaya Ketinggian', items: ['Terjatuh dari ketinggian', 'Material terjatuh dari atas', 'Kegagalan Full Body Harness'] },
  { id: 'drv', n: '🚜 Bahaya Mobilitas', items: ['Tabrakan unit', 'Blind spot', 'Kegagalan fungsi rem/hidrolik'] },
  { id: 'lis', n: '⚡ Bahaya Listrik', items: ['Tersengat listrik', 'Korsleting', 'Kabel terkelupas'] },
  { id: 'kim', n: '🧪 Bahaya Kimia', items: ['Terhirup gas beracun', 'Terkena cairan kimia', 'Iritasi'] },
  { id: 'hot', n: '🔥 Bahaya Hot Work', items: ['Percikan api las', 'Risiko kebakaran', 'Paparan radiasi sinar'] },
  { id: 'fis', n: '🌡️ Bahaya Lingkungan', items: ['Kebisingan', 'Suhu ekstrem', 'Getaran berlebih'] }
];

const CTDATA = ['Helm Safety', 'Kacamata Safety', 'Sarung Tangan', 'Sepatu Safety', 'Masker', 'Ear Plug', 'Full Body Harness', 'Rompi Safety', 'Lainnya'];
const STANDAR_POSISI = ["CREW", "ELECTRICIAN", "PLUMBER", "DRIVER", "HSE", "SUPERVISOR"];
const STANDAR_LOKASI = ['PAD 1', 'PAD 2', 'PAD 3', 'PAD 4', 'PAD 5', 'PAD 6', 'PAD 7', 'PAD 8'];

/* ============================================================
   LZ COMPRESS (UNTUK DONE URL)
   ============================================================ */
const LZ = {
  compress(s){ try{ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return btoa(s); } },
  decompress(s){ try{ let b = s.replace(/-/g,'+').replace(/_/g,'/'); while(b.length % 4) b += '='; return decodeURIComponent(escape(atob(b))); }catch(e){ return null; } }
};

/* ============================================================
   APP STATE
   ============================================================ */
const S = { n:'', nid:'', p:'', pt:'', l:'', tgl:'', jam:'', spvIdx:null, job:'', gps:'Menunggu lokasi...', photoBase64:'' };
const HC = {}; const HZ = {}; const CT = {}; let customHazards = [];
let curStep = 1; const TOTAL_STEPS = 6;

/* ============================================================
   INIT & ROUTING
   ============================================================ */
function init(){
  const params = new URLSearchParams(location.search);
  const idParam = params.get('id'); 
  const dParam = params.get('d');

  if(idParam){ showSupervisor(idParam); return; }
  if(dParam){ showDone(dParam); return; } 

  loadDraft();
  setDateTime();
  renderWorker();
}

function setDateTime(){
  const d = new Date();
  S.tgl = d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});
  S.jam = d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateDisplay').textContent = d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

/* ============================================================
   CANVAS SIGNATURE HANDLER
   ============================================================ */
function initSignaturePad(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Set white background
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  let drawing = false;

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: x * (canvas.width / rect.width), y: y * (canvas.height / rect.height) };
  };

  const start = (e) => { e.preventDefault(); drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
  const draw = (e) => { e.preventDefault(); if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
  const stop = (e) => { e.preventDefault(); drawing = false; };

  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
  canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false}); canvas.addEventListener('touchend', stop, {passive: false});
}

function clearSignature(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function getSignatureBase64(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return '';
  // Cek apakah kanvas kosong (belum ditandatangani)
  const blank = document.createElement('canvas');
  blank.width = canvas.width; blank.height = canvas.height;
  const bCtx = blank.getContext('2d'); bCtx.fillStyle = "#ffffff"; bCtx.fillRect(0,0,blank.width,blank.height);
  if(canvas.toDataURL() === blank.toDataURL()) return '';
  return canvas.toDataURL('image/png');
}

/* ============================================================
   GPS GEOLOCATION
   ============================================================ */
function requestGPS() {
  const gpsBox = document.getElementById('gpsIndicator');
  if (navigator.geolocation) {
    if(gpsBox) gpsBox.innerHTML = '🔄 Mencari koordinat lokasi Anda...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        S.gps = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        if(gpsBox) gpsBox.innerHTML = '📍 Lokasi Terkunci!';
        autoSaveDraft();
      },
      (err) => {
        S.gps = 'Akses GPS Ditolak / Gagal';
        if(gpsBox) gpsBox.innerHTML = '⚠️ Gagal mendapatkan lokasi GPS';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  } else {
    S.gps = "GPS Tidak Didukung Browser";
  }
}

/* ============================================================
   KAMERA / FOTO LAPANGAN
   ============================================================ */
function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Kompresi Gambar agar ringan
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scaleSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      S.photoBase64 = canvas.toDataURL('image/jpeg', 0.6); // Kualitas 60%
      document.getElementById('fotoPreview').src = S.photoBase64;
      document.getElementById('fotoPreview').style.display = 'block';
      autoSaveDraft();
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}

/* ============================================================
   RENDER WORKER (STEP 1 - 6)
   ============================================================ */
function renderWorker(){ renderStep1(); renderStep2(); renderStep3(); renderStep4(); renderStep5(); renderStep6('—','—'); renderDots(); }

function normalizePhone(value){ let p = String(value || '').replace(/\D/g, ''); if(p.startsWith('0')) p = '62' + p.slice(1); else if(p.startsWith('8')) p = '62' + p; return p; }

function renderStep1(){
  document.getElementById('step1').innerHTML = `
    <div class="section-title"><span class="icon icon-blue">👤</span>Data Diri Pekerja</div>
    <label>Nama Lengkap *</label><input type="text" id="nama" value="${escHtml(S.n)}" oninput="autoSaveDraft()">
    <label>No. ID Pekerja *</label><input type="text" id="nid" value="${escHtml(S.nid)}" oninput="autoSaveDraft()">
    <label>No. WhatsApp *</label><input type="tel" id="telp" value="${escHtml(S.p)}" oninput="this.value=normalizePhone(this.value); autoSaveDraft()">
    <label>Posisi / Jabatan *</label><select id="posisi" onchange="autoSaveDraft()">
      <option value="">-- Pilih --</option>${STANDAR_POSISI.map(v => `<option value="${v}" ${S.pt === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select>
    <label>Lokasi Kerja *</label><select id="lokasiSelect" onchange="autoSaveDraft()">
      <option value="">-- Pilih --</option>${STANDAR_LOKASI.map(v => `<option value="${v}" ${S.l === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select>
    <label>Pilih Supervisor *</label><select id="spvSelect" onchange="selectSPV(this.value)">
      <option value="">-- Pilih --</option>${SUPERVISORS.map((s,i) => `<option value="${i}" ${S.spvIdx == i ? 'selected' : ''}>${escHtml(s.name)}</option>`).join('')}
    </select>
    <button class="btn btn-primary" style="margin-top:20px" onclick="next1()">Lanjut ke Kesehatan →</button>`;
}
function selectSPV(val){ S.spvIdx = val === '' ? null : parseInt(val); autoSaveDraft(); }

function renderStep2(){
  document.getElementById('step2').innerHTML = `
    <div class="section-title"><span class="icon icon-red">❤️</span>Kondisi Kesehatan</div>
    ${buildHCItem('hc1','Sehat hari ini?')}${buildHCItem('hc2','Tidur cukup?')}
    ${buildHCItem('hc3','Bebas obat/alkohol?')}${buildHCItem('hc4','Paham risiko?')}
    <div class="row"><button class="btn btn-back" onclick="goStep(1)">Kembali</button><button class="btn btn-primary" onclick="next2()">Lanjut →</button></div>`;
}
function buildHCItem(id, q){
  return `<div class="check-group"><p style="font-weight:700;margin-bottom:10px">${q}</p>
    <div class="check-item" onclick="selHC('${id}','ya',this)"><input type="radio" name="${id}" ${HC[id]==='ya'?'checked':''}><label>✅ Ya</label></div>
    <div class="check-item" onclick="selHC('${id}','tidak',this)"><input type="radio" name="${id}" ${HC[id]==='tidak'?'checked':''}><label>❌ Tidak</label></div></div>`;
}
function selHC(id, val, el){ HC[id] = val; el.parentElement.querySelectorAll('input').forEach(i=>i.checked=false); el.querySelector('input').checked=true; autoSaveDraft(); }

function renderStep3(){
  document.getElementById('step3').innerHTML = `
    <div class="section-title"><span class="icon icon-orange">⚠️</span>Identifikasi Bahaya</div>
    <label>Deskripsi pekerjaan *</label><textarea id="jobDesc" oninput="autoSaveDraft()">${escHtml(S.job)}</textarea>
    <div id="hzList"></div>
    <div class="row" style="margin-top:20px"><button class="btn btn-back" onclick="goStep(2)">Kembali</button><button class="btn btn-primary" onclick="next3()">Lanjut →</button></div>`;
  
  let html = '';
  HZDATA.forEach(cat => {
    html += `<div class="hazard-card"><div class="hazard-title">${cat.n}</div>`;
    cat.items.forEach((item, i) => {
      const key = `${cat.id}_${i}`; if(!HZ[key]) HZ[key] = { checked:false, control:'' };
      html += `<div class="hazard-check"><input type="checkbox" id="${key}" ${HZ[key].checked ? 'checked' : ''} onchange="HZ['${key}'].checked=this.checked; document.getElementById('ctrl_${key}').style.display=this.checked?'block':'none'; autoSaveDraft()"> <label for="${key}">${item}</label></div>
      <div class="control-box" id="ctrl_${key}" style="display:${HZ[key].checked ? 'block' : 'none'}"><textarea placeholder="Tindakan kontrol wajib..." oninput="HZ['${key}'].control=this.value; autoSaveDraft()">${escHtml(HZ[key].control)}</textarea></div>`;
    });
    html += `</div>`;
  });
  document.getElementById('hzList').innerHTML = html;
}

function renderStep4(){
  let ctHtml = CTDATA.map((item, i) => {
    const key = 'ct' + i;
    return `<div class="hazard-check"><input type="checkbox" id="${key}" ${CT[key] ? 'checked' : ''} onchange="CT['${key}']=this.checked; autoSaveDraft()"><label for="${key}">${item}</label></div>`;
  }).join('');

  document.getElementById('step4').innerHTML = `
    <div class="section-title"><span class="icon icon-green">🛡️</span>APD & Bukti Lapangan</div>
    <label>Pilih APD yang digunakan:</label><div style="margin-bottom:20px">${ctHtml}</div>
    
    <label>📸 Foto Kondisi Lapangan / APD Lengkap *</label>
    <div class="photo-box">
      <input type="file" accept="image/*" capture="environment" id="fotoLap" onchange="handlePhotoUpload(event)">
      <img id="fotoPreview" src="${S.photoBase64 || ''}" style="display:${S.photoBase64 ? 'block' : 'none'}">
    </div>

    <div class="row" style="margin-top:20px"><button class="btn btn-back" onclick="goStep(3)">Kembali</button><button class="btn btn-primary" onclick="next4()">Review →</button></div>`;
}

function renderStep5(){
  const spv = SUPERVISORS[S.spvIdx] || {};
  document.getElementById('step5').innerHTML = `
    <div class="section-title"><span class="icon icon-purple">📋</span>Review & Tanda Tangan</div>
    <div class="sbox"><strong>Pekerja:</strong> ${escHtml(S.n)}<br><strong>Lokasi:</strong> ${escHtml(S.l)}</div>
    
    <div class="gps-box" id="gpsIndicator">📍 Memuat Lokasi GPS...</div>

    <label style="margin-top:20px">✍️ Tanda Tangan Anda (Pekerja) *</label>
    <div class="sig-container">
      <canvas id="workerCanvas" class="sig-pad" width="400" height="180"></canvas>
    </div>
    <button class="clear-sig" onclick="clearSignature('workerCanvas')">🗑️ Hapus Tanda Tangan</button>

    <div style="background:#dbeafe;border-radius:12px;padding:16px;margin:20px 0;font-size:.86rem;color:#1e40af;">
      <strong>📤 Kirim ke:</strong><br>👨‍💼 ${escHtml(spv.name || '-')}
    </div>
    <div class="row"><button class="btn btn-back" onclick="goStep(4)">Kembali</button><button class="btn btn-wa" onclick="submitChecklist()">Kirim Laporan</button></div>`;
}

/* --- LOGIKA NAVIGASI --- */
function next1(){ S.n=document.getElementById('nama').value; S.nid=document.getElementById('nid').value; S.p=document.getElementById('telp').value; S.pt=document.getElementById('posisi').value; S.l=document.getElementById('lokasiSelect').value; if(!S.n || !S.p || S.spvIdx === null){ showAlert("Isi data & pilih SPV!"); return; } autoSaveDraft(); goStep(2); }
function next2(){ if(Object.keys(HC).length < 4){ showAlert("Jawab semua pertanyaan!"); return; } goStep(3); }
function next3(){ S.job=document.getElementById('jobDesc').value; if(!S.job) { showAlert("Isi deskripsi!"); return; } goStep(4); }
function next4(){ 
  // Cek Foto
  if(!S.photoBase64){ showAlert("⚠️ Wajib mengambil foto lapangan / APD sebelum lanjut."); return; }
  autoSaveDraft(); 
  goStep(5); 
  // Panggil GPS saat masuk halaman Review
  requestGPS();
  setTimeout(() => initSignaturePad('workerCanvas'), 200);
}
function goStep(n){ curStep=n; document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i+1===n)); renderDots(); window.scrollTo(0,0); }
function renderDots(){ document.getElementById('dots').innerHTML = Array(6).fill(0).map((_,i) => `<div class="dot ${i+1===curStep?'active':''}"></div>`).join(''); }

/* ============================================================
   SUBMIT & KE GAS
   ============================================================ */
async function postToGAS(payload){
  const res = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
  return JSON.parse(await res.text());
}

async function submitChecklist(){
  const workerSign = getSignatureBase64('workerCanvas');
  if(!workerSign) { showAlert("⚠️ Anda wajib membubuhkan tanda tangan!"); return; }

  const hz = Object.entries(HZ).filter(([k,v])=>v.checked).map(([k,v])=>({name:k, control:v.control}));
  const ct = CTDATA.filter((item, i) => CT['ct'+i]);
  const spv = SUPERVISORS[S.spvIdx];

  const data = { action:'submit', n:S.n, nid:S.nid, p:S.p, pt:S.pt, l:S.l, tgl:S.tgl, jam:S.jam, job:S.job, hz, ct, spv_name:spv.name, spv_wa:spv.wa, gps:S.gps, photoBase64:S.photoBase64, workerSign:workerSign };

  showProgress('💾 Mengunggah File & Data...', 'Membutuhkan waktu beberapa detik');
  try {
    const res = await postToGAS(data);
    data.rowId = res.rowId;
    const shortUrl = `${CONFIG.BASE_URL}?id=${res.rowId}`;
    await postToGAS({ action: 'updateVerifyLink', rowId: res.rowId, verifyLink: shortUrl });

    hideProgress();
    
    const msg = `🔔 *MOHON VERIFIKASI SAFETY CHECKLIST*\n\n👷 Nama: ${data.n}\n📍 Lokasi: ${data.l}\n📅 ${data.tgl} | ⏰ ${data.jam}\n\n✅ *Klik link berikut untuk CEK FOTO & VERIFIKASI:*\n${shortUrl}\n\n_Powered by Pausbiru7_`;
    window._waSPVLink = `https://wa.me/${spv.wa}?text=${encodeURIComponent(msg)}`;
    window.open(window._waSPVLink, '_blank');
    
    renderStep6(res.rowId, spv.name); goStep(6);
  } catch(e) { hideProgress(); showAlert("Gagal mengirim ke server. Cek koneksi Anda."); }
}

function renderStep6(id, spv){
  document.getElementById('step6').innerHTML = `<div class="result-card"><div class="big">📨</div><h2 style="color:#059669">Terkirim!</h2><p>ID: ${id}</p><button class="btn btn-primary" onclick="resetApp()">Buat Baru</button></div>`;
}

/* ============================================================
   SUPERVISOR MODE (OTOMATIS PENDEK)
   ============================================================ */
async function showSupervisor(id){
  document.getElementById('WM').style.display = 'none';
  const sm = document.getElementById('SM'); sm.style.display = 'block';
  sm.innerHTML = `<div class="section" style="text-align:center;padding:60px 24px"><div class="spinner"></div><p>Mencari ID: ${escHtml(id)}</p></div>`;

  try {
    const res = await postToGAS({ action: 'get', rowId: id });
    const d = res.data;
    
    // JIKA SUDAH APPROVED / REJECTED -> LANGSUNG KE HALAMAN HASIL
    if(d.sv && (d.sv.status === 'APPROVED' || d.sv.status === 'REJECTED')){
      showDone(LZ.compress(JSON.stringify(d)));
      return; 
    }

    window.svData = d;
    sm.innerHTML = `
      <div class="sv-banner"><h2>Verifikasi Supervisor</h2><p>Cek Foto Lapangan & Tanda Tangan</p></div>
      <div class="section">
        <div style="text-align:center; margin-bottom:15px;">
          <a href="${d.fotoUrl || '#'}" target="_blank" style="background:#2e86c1;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;display:inline-block;">📸 Buka Foto Pekerja</a>
          <a href="${d.gps || '#'}" target="_blank" style="background:#10b981;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;display:inline-block;margin-left:5px;">📍 Buka Peta Lokasi</a>
        </div>
        
        <label>Nama Anda *</label><select id="svNama"><option value="">-- Pilih --</option>${SUPERVISORS.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}</select>
        <label>PIN Rahasia *</label><input type="password" id="svPin" maxlength="6" oninput="checkSupervisorPin(this.value)">
        <label>Catatan (opsional)</label><textarea id="svNote"></textarea>
        
        <label style="margin-top:15px">✍️ Tanda Tangan Supervisor *</label>
        <div class="sig-container"><canvas id="spvCanvas" class="sig-pad" width="400" height="180"></canvas></div>
        <button class="clear-sig" onclick="clearSignature('spvCanvas')">🗑️ Hapus Tanda Tangan</button>

        <div class="row" style="margin-top:20px;">
          <button class="btn btn-approve" onclick="doApprove()" disabled style="opacity:0.5;">✅ SETUJUI</button>
          <button class="btn btn-reject" onclick="doReject()">❌ TOLAK</button>
        </div>
      </div>`;
    setTimeout(() => initSignaturePad('spvCanvas'), 200);
  } catch(e) { sm.innerHTML = `<div class="section"><h3>Gagal Memuat</h3><p>${e.message}</p></div>`; }
}

function checkSupervisorPin(val) {
  const btn = document.querySelector('.btn-approve'); if(!btn) return;
  if(val === "7788") { btn.disabled = false; btn.style.opacity = "1"; } else { btn.disabled = true; btn.style.opacity = "0.5"; }
}

async function doApprove(){
  const sign = getSignatureBase64('spvCanvas');
  if(!sign){ showAlert("⚠️ Supervisor wajib tanda tangan!"); return; }
  const d = window.svData; d.sv = { nama: document.getElementById('svNama').value, status: 'APPROVED', note: document.getElementById('svNote').value, time: formatIDDateTime() };
  
  showProgress("Menyimpan Tanda Tangan...", "");
  await postToGAS({ action: 'respond', rowId: d.rowId, status: 'APPROVED', svname: d.sv.nama, svnote: d.sv.note, svtime: d.sv.time, svsign: sign });
  hideProgress();
  kirimNotifikasiKeWorker(d);
  showDone(LZ.compress(JSON.stringify(d)));
}

async function doReject(){
  const d = window.svData; d.sv = { nama: document.getElementById('svNama').value, status: 'REJECTED', note: document.getElementById('svNote').value, time: formatIDDateTime() };
  showProgress("Memproses Penolakan...", "");
  await postToGAS({ action: 'respond', rowId: d.rowId, status: 'REJECTED', svname: d.sv.nama, svnote: d.sv.note, svtime: d.sv.time, svsign: "" });
  hideProgress();
  kirimNotifikasiKeWorker(d);
  showDone(LZ.compress(JSON.stringify(d)));
}

function kirimNotifikasiKeWorker(data){
  const shortUrl = `${CONFIG.BASE_URL}?id=${data.rowId || 'CHECKLIST'}`;
  const workerMsg = `✅ *SAFETY CHECKLIST DISETUJUI*\n\n👨‍💼 Supervisor: ${data.sv.nama}\n🔗 Detail:\n${shortUrl}\n\n_Powered by Pausbiru7_`;
  const hseMsg = `📋 *LAPORAN SAFETY CHECKLIST*\nStatus: ${data.sv.status}\nPekerja: ${data.n}\n🔗 Detail Laporan:\n${shortUrl}\n\n_Powered by Pausbiru7_`;
  window._waWorkerLink = `https://wa.me/${data.p}?text=${encodeURIComponent(workerMsg)}`;
  window._waHSELink    = `https://wa.me/${CONFIG.HSE_WA}?text=${encodeURIComponent(hseMsg)}`;
}

let _notifStep = 1;
function kirimSemuaNotif(btn){
  if(_notifStep === 1){ window.open(window._waWorkerLink, '_blank'); _notifStep = 2; btn.innerHTML = 'Kirim ke HSE →'; } 
  else { window.open(window._waHSELink, '_blank'); btn.innerHTML = 'Selesai'; btn.disabled = true; }
}

function showDone(enc){
  document.getElementById('WM').style.display = 'none'; document.getElementById('SM').style.display = 'none'; document.getElementById('SD').style.display = 'block';
  const data = JSON.parse(LZ.decompress(enc));
  document.getElementById('SD').innerHTML = `<div class="section"><h2 style="text-align:center; color:${data.sv.status==='APPROVED'?'#059669':'#dc2626'}">${data.sv.status}</h2>
  <div style="text-align:center; margin-top:20px"><button class="btn btn-wa" onclick="kirimSemuaNotif(this)">Kirim WA Pekerja</button></div></div>`;
}

function autoSaveDraft(){ /* Logika Draft sama seperti sebelumnya, dihapus agar kode lebih pendek */ }
function loadDraft(){ /* Logika Draft */ }
function formatIDDateTime(){ const d=new Date(); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes()}`; }
function escHtml(s){ return typeof s==='string'?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

init();
</script>
</body>
</html>
